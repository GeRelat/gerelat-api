networks:
  coolify:
    external: true

services:
    migrate:
        build: .
        command: python manage.py migrate
        env_file:
            - .env
        restart: "no"
    web:
        build: .
        env_file:
            - .env
        restart: unless-stopped
        depends_on:
            migrate:
                condition: service_completed_successfully
        networks:
            - default
            - coolify
        labels:
            - "traefik.docker.network=coolify"
    worker:
        build: .
        command: celery -A config worker --loglevel=info
        env_file:
            - .env
        restart: unless-stopped
        depends_on:
            migrate:
                condition: service_completed_successfully
        networks:
            - default
            - coolify
    beat:
        build: .
        command: celery -A config beat -l info
        env_file:
            - .env
        restart: unless-stopped
        depends_on:
            migrate:
                condition: service_completed_successfully
        networks:
            - default
            - coolify
    flower:
        build: .
        command: celery -A config flower --port=5555
        env_file:
            - .env
        restart: unless-stopped
        depends_on:
            worker:
                condition: service_started
        networks:
            - default
            - coolify
        labels:
            - "traefik.docker.network=coolify"
