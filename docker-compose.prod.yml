services:
    migrate:
        build: .
        command: uv run manage.py migrate
        env_file:
            - .env
        restart: "no"
    web:
        build: .
        command: uv run granian config.asgi:application --interface asgi --host 0.0.0.0 --port 8000
        env_file:
            - .env
        restart: unless-stopped
        depends_on:
            migrate:
                condition: service_completed_successfully
    worker:
        build: .
        command: uv run celery -A config worker --loglevel=info
        env_file:
            - .env
        restart: unless-stopped
        depends_on:
            migrate:
                condition: service_completed_successfully
    beat:
        build: .
        command: uv run celery -A config beat -l info
        env_file:
            - .env
        restart: unless-stopped
        depends_on:
            migrate:
                condition: service_completed_successfully
    flower:
        build: .
        command: uv run celery -A config flower --port=5555
        env_file:
            - .env
        restart: unless-stopped
        depends_on:
            worker:
                condition: service_started
