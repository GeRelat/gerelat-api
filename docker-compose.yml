services:
    redis:
        image: redis:7-alpine
        ports:
            - "6379:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
    db:
        image: postgres:16-alpine
        volumes:
            - postgres_data:/var/lib/postgresql/data/
        environment:
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=postgres
            - POSTGRES_DB=gerelat
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d gerelat"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        ports:
            - "5432:5432"
    migrate:
        build: .
        command: uv run manage.py migrate
        volumes:
            - .:/app
            - /app/.venv
        env_file:
            - .env
        depends_on:
            db:
                condition: service_healthy
    web:
        build: .
        command: uv run manage.py runserver 0.0.0.0:8000
        ports:
            - "8000:8000"
        volumes:
            - .:/app
            - /app/.venv
        env_file:
            - .env
        depends_on:
            migrate:
                condition: service_completed_successfully
            redis:
                condition: service_healthy
    worker:
        build: .
        command: uv run celery -A config worker --loglevel=info
        volumes:
            - .:/app
            - /app/.venv
        env_file:
            - .env
        depends_on:
            migrate:
                condition: service_completed_successfully
            redis:
                condition: service_healthy
    beat:
        build: .
        command: uv run celery -A config beat -l info
        volumes:
            - .:/app
            - /app/.venv
        env_file:
            - .env
        depends_on:
            migrate:
                condition: service_completed_successfully
            redis:
                condition: service_healthy
    flower:
        build: .
        command: uv run celery -A config flower --port=5555
        ports:
            - "5555:5555"
        volumes:
            - .:/app
            - /app/.venv
        env_file:
            - .env
        depends_on:
            redis:
                condition: service_healthy
            worker:
                condition: service_started
volumes:
    postgres_data:
