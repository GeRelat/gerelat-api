services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=gerelat
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d gerelat" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "5432:5432"

  web:
    build: .
    command: sh -c "uv run manage.py migrate && uv run manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/.venv
    env_file:
      - .env.dev
    environment:
      DJANGO_DB_HOST: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
